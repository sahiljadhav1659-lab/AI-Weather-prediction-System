{% extends "base.html" %}

{% block content %}

<div class="container py-5">

<div class="row justify-content-center">

<div class="col-lg-5">

<div class="glass-card p-5 fade-up">

<div class="text-center mb-4">

<i class="bi bi-cloud-sun-fill" style="font-size:56px; color:var(--primary);"></i>

<h2 class="fw-bold" style="color:var(--primary);">
    Welcome Back
</h2>

<p class="text-muted">
    Login to AI Weather Prediction System
</p>

</div>

{% if error %}
<div class="alert alert-danger text-center">{{ error }}</div>
{% endif %}

{% if success %}
<div class="alert alert-success text-center">{{ success }}</div>
{% endif %}

<form method="POST">

<div class="mb-4">
    <label class="fw-bold"><i class="bi bi-envelope"></i> Email Address</label>
    <input type="email" name="email" class="form-control premium-input" placeholder="Enter Email" required>
</div>

<div class="mb-4">
    <label class="fw-bold"><i class="bi bi-lock"></i> Password</label>
    <input type="password" id="password" name="password" class="form-control premium-input" placeholder="Enter Password" required>
</div>

<div class="text-end mb-4">
    <button type="button" class="btn btn-sm btn-outline-primary" onclick="togglePassword()">
        <i class="bi bi-eye"></i> Show Password
    </button>
</div>

<div class="d-grid">
    <button class="premium-btn">
        <i class="bi bi-box-arrow-in-right"></i> Login
    </button>
</div>

</form>

<hr>

<div class="text-center">
    Don't have an account?
    <a href="/register" class="fw-bold" style="color:var(--primary);">Register Now</a>
</div>

</div>

</div>

</div>

</div>

<script>

function togglePassword(){
    var x=document.getElementById("password");
    if(x.type==="password"){
        x.type="text";
    }else{
        x.type="password";
    }
}

</script>

{% endblock %}
