<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Admin Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#2193b0,#6dd5ed);
    font-family:Arial,sans-serif;
}

.login-box{
    width:420px;
    background:white;
    padding:40px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
}

.icon{
    font-size:60px;
    text-align:center;
}

h2{
    text-align:center;
    color:#0d6efd;
    margin-bottom:25px;
}
</style>

</head>

<body>

<div class="login-box">

<div class="icon">🌤</div>

<h2>Admin Login</h2>

{% if error %}
<div class="alert alert-danger">
{{ error }}
</div>
{% endif %}

<form method="POST" action="{{ url_for('admin_login') }}">

<div class="mb-3">
<label>Username</label>
<input
type="text"
name="username"
class="form-control"
required>
</div>

<div class="mb-3">
<label>Password</label>
<input
type="password"
name="password"
class="form-control"
required>
</div>

<button type="submit" class="btn btn-primary w-100">
Login
</button>

</form>

</div>

</body>
</html>
