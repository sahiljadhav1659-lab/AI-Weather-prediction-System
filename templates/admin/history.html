<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Prediction History</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>

body{
    background:#f4f7fc;
}

.navbar{
    box-shadow:0 2px 15px rgba(0,0,0,.15);
}

.card{
    border:none;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.table{
    margin-bottom:0;
}

.table thead{
    background:#0d6efd;
    color:white;
}

</style>

</head>

<body>

<nav class="navbar navbar-dark bg-primary">

<div class="container-fluid">

<span class="navbar-brand">

🌤 Weather Prediction Admin

</span>

<div>

<a href="/admin/dashboard" class="btn btn-light btn-sm">

Dashboard

</a>

<a href="/admin/reports" class="btn btn-warning btn-sm">

Reports

</a>

<a href="/admin/logout" class="btn btn-danger btn-sm">

Logout

</a>

</div>

</div>

</nav>

<div class="container py-5">

<h2 class="mb-4">

<i class="bi bi-clock-history"></i>

Prediction History

</h2>

<div class="card">

<div class="card-header bg-primary text-white">

Recent Weather Predictions

</div>

<div class="card-body">

<table class="table table-hover table-bordered">

<thead>

<tr>

<th>ID</th>
<th>Date</th>
<th>Time</th>
<th>City</th>
<th>Temperature</th>
<th>Humidity</th>
<th>Wind</th>
<th>Rainfall</th>
<th>Prediction</th>

</tr>

</thead>

<tbody>

{% for row in records %}

<tr>

{% for item in row %}

<td>{{ item }}</td>

{% endfor %}

</tr>

{% endfor %}

</tbody>

</table>

</div>

</div>

</div>

</body>
</html>
