{% extends "base.html" %}

{% block content %}

<div class="container py-5">

<div class="row justify-content-center">

<div class="col-lg-7">

<div class="weather-card p-5">

<h2 class="text-center mb-4">
    <i class="bi bi-lightning-charge-fill"></i> Quick Weather Prediction
</h2>

<form method="POST">

<div class="row">

<div class="col-md-6 mb-3">
    <label class="form-label fw-bold"><i class="bi bi-thermometer-half"></i> Temperature</label>
    <input type="number" name="temperature" step="0.1" class="form-control premium-input" placeholder="Enter Temperature" required>
</div>

<div class="col-md-6 mb-3">
    <label class="form-label fw-bold"><i class="bi bi-droplet-half"></i> Humidity</label>
    <input type="number" name="humidity" step="0.1" class="form-control premium-input" placeholder="Enter Humidity" required>
</div>

</div>

<button class="premium-btn mt-3">
    <i class="bi bi-rocket-takeoff"></i> Predict Weather
</button>

</form>

{% if prediction %}

<div class="text-center mt-5">

    <div style="font-size:70px;">{{ icon }}</div>

    <h2 class="mt-2">{{ prediction }}</h2>

    <p class="text-muted mt-3">
        {{ current_date }} &nbsp;|&nbsp; {{ current_time }}
    </p>

</div>

{% endif %}

</div>

</div>

</div>

</div>

{% endblock %}
