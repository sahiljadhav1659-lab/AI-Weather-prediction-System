{% extends "base.html" %}

{% block content %}

<style>

body{
    background: linear-gradient(135deg,#4facfe,#00c6fb,#667eea);
    min-height:100vh;
}

.weather-card{

    background:rgba(255,255,255,.18);

    backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,.25);

    border-radius:30px;

    box-shadow:0 20px 60px rgba(0,0,0,.25);

    color:white;

}

.form-control{

    border-radius:15px;

    padding:14px;

}

.btn-weather{

    border-radius:50px;

    padding:15px;

    font-size:20px;

    font-weight:bold;

    background:white;

    color:#2563eb;

    border:none;

    transition:.3s;

}

.btn-weather:hover{

    transform:translateY(-3px);

}

.big-icon{

    font-size:90px;

}

.temp{

    font-size:70px;

    font-weight:bold;

}

.condition{

    font-size:32px;

    font-weight:600;

}

</style>

<div class="container py-5">

<div class="row justify-content-center">

<div class="col-lg-7">

<div class="weather-card p-5">

<h2 class="text-center mb-4">

🌤 AI Weather Prediction

</h2>

<form method="POST">

<div class="row">

<div class="col-md-6 mb-3">

<input
type="number"
name="temperature"
step="0.1"
class="form-control"
placeholder="🌡 Temperature"
required>

</div>

<div class="col-md-6 mb-3">

<input
type="number"
name="humidity"
step="0.1"
class="form-control"
placeholder="💧 Humidity"
required>

</div>

</div>

<button class="btn-weather w-100">

Predict Weather

</button>

</form>

{% if prediction %}

<hr class="my-5 text-white">

<div class="text-center">

<div class="big-icon">

{{ icon }}

</div>

<div class="temp">

{{ temperature }}°

</div>

<div class="condition">

{{ prediction }}

</div>

<p class="mt-3">

📅 {{ current_date }}

&nbsp;&nbsp;•&nbsp;&nbsp;

🕒 {{ current_time }}

</p>

</div>

{% endif %}

</div>

</div>

</div>

</div>

{% endblock %}
